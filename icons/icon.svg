<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1e3d"/>
      <stop offset="50%" stop-color="#0f2b57"/>
      <stop offset="100%" stop-color="#071224"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#1e3a8a" stroke-width="6"/>

  <!-- Subtle grid lines pattern for tech/AI vibe -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1e3a8a" stroke-width="2" stroke-dasharray="6 6" opacity="0.4"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.2"/>

  <!-- Central Crest / Shield -->
  <path d="M256 90 L370 140 V260 C370 335 256 395 256 395 C256 395 142 335 142 260 V140 Z" fill="#0c234b" stroke="url(#goldGrad)" stroke-width="8" filter="url(#glow)"/>

  <!-- Graduation Cap (Academic Excellence) -->
  <path d="M256 160 L325 195 L256 230 L187 195 Z" fill="url(#goldGrad)"/>
  <path d="M210 215 V245 C210 260 302 260 302 245 V215" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
  <!-- Cap Tassel -->
  <path d="M310 200 V235" stroke="#fef08a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="310" cy="238" r="4" fill="#fef08a"/>

  <!-- Lettering: MITS -->
  <text x="256" y="325" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">MITS</text>

  <!-- Subtitle: CS AI -->
  <rect x="206" y="340" width="100" height="24" rx="12" fill="url(#cyanGrad)"/>
  <text x="256" y="356" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="800" fill="#071224" text-anchor="middle" letter-spacing="2">CS • AI</text>

  <!-- Live Pulse Dot Indicator (Attendance Status) -->
  <circle cx="350" cy="155" r="10" fill="#10b981" filter="url(#glow)"/>
  <circle cx="350" cy="155" r="16" fill="none" stroke="#10b981" stroke-width="2" opacity="0.6"/>
</svg>
