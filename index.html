      var idx = 0;
      var t = setInterval(function() {
        if (!fill || !pctText) {
          clearInterval(t);
          return;

        pct += Math.floor(Math.random() * 20) + 15;
        if (pct >= 95) {

          idx++;

    // ATTENDANCE MATH UTILITIES
    // Tier 1: 90% Threshold (Full 5 Internal Marks)
    // Tier 2: 75% Threshold (University Exam Eligibility)
    // ==========================================
    function calculatePercentage(attended, held) {
      if (!held || held <= 0) return 100;
      const pct = (attended / held) * 100;
      return Math.round(pct * 10) / 10;
    }

    function getClassesToReachTarget(attended, held, targetPct = 90, strictlyOver = false) {
      if (held <= 0) return 0;
      const currentPct = (attended / held) * 100;
      
      if (strictlyOver) {
        if (currentPct > targetPct) return 0;
        const diff = (targetPct * held - 100 * attended) / (100 - targetPct);
        return Math.max(1, Math.floor(diff) + 1);
      }

      if (currentPct >= targetPct) return 0;
      const needed = Math.ceil((targetPct * held - 100 * attended) / (100 - targetPct));
      return Math.max(1, needed);
    }

          borderColor: 'border-blue-500/30',
          badgeBg: 'bg-blue-100 text-blue-900 dark:bg-blue-900/40 dark:text-blue-300 border border-blue-300/40'
        };
      } else if (percentage >= 80) {
        return {
          status: 'three-marks',
          marks: 3,
          marksLabel: '3 Mark',
          label: '3 Mark (80-85%)',
          color: 'teal',
          ringColor: '#14b8a6', // Teal
          bgColor: 'bg-teal-500/10 dark:bg-teal-950/30',
          textColor: 'text-teal-600 dark:text-teal-400',

          badgeBg: 'bg-teal-100 text-teal-900 dark:bg-teal-900/40 dark:text-teal-300 border border-teal-300/40'
        };
      } else if (percentage >= 75) {
        return {
          status: 'two-marks',
          marks: 2,
          marksLabel: '2 Mark',
          label: '2 Mark (75-80%)',
          color: 'emerald',
          ringColor: '#10b981', // Green

          badgeBg: 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-300 border border-emerald-300/40'
        };
      } else {
        return {
          status: 'critical',
          marks: 0,
          marksLabel: '0 Mark',
          label: 'Shortage (<75%)',
          color: 'rose',
          ringColor: '#f43f5e',
          bgColor: 'bg-rose-500/10 dark:bg-rose-950/30',
          textColor: 'text-rose-600 dark:text-rose-400',
          borderColor: 'border-rose-500/30',
          badgeBg: 'bg-rose-100 text-rose-800 dark:bg-rose-900/40 dark:text-rose-300 border border-rose-300/40'
        };
      }
    }

    function calculateBunkInfo(attended, held) {
      if (held === 0) {
        return { type: 'initial', tier: 90, marks: 5, count: 0, message: 'No classes conducted yet' };
      }
      const pct = (attended / held) * 100;
      const bunk75 = Math.floor((4 * attended - 3 * held) / 3);

      // Tier 1: Attendance >= 90% (5 Mark)
      if (pct >= 90) {
        const bunk90 = Math.floor((10 * attended - 9 * held) / 9);

        if (bunk90 === 0) {
          return {
            type: 'edge-90',
            tier: 90,
            marks: 5,
            count: 0,
            bunksTo75: bunk75,
            message: 'Missing the next class drops attendance to 4 Mark (<90%)!'
          };
        }
        return {
          type: 'safe-90',
          tier: 90,
          marks: 5,
          count: bunk90,
          bunksTo75: bunk75,
          message: `You can bunk ${bunk90} ${bunk90 === 1 ? 'class' : 'classes'} till you drop to 4 Mark (<90%)`
        };
      }

      // Tier 2: 85% <= Attendance < 90% (4 Mark)
      if (pct >= 85) {
        const bunk85 = Math.floor((20 * attended - 17 * held) / 17);
        const neededFor90 = Math.max(1, 9 * held - 10 * attended);

        if (bunk85 === 0) {
          return {
            type: 'edge-85',
            tier: 85,
            marks: 4,
            count: 0,
            bunksTo75: bunk75,
            neededForNext: neededFor90,
            message: '4 Mark: Missing next class drops to 3 Mark (<85%)!'
          };
        }
        return {
          type: 'safe-85',
          tier: 85,
          marks: 4,
          count: bunk85,
          bunksTo75: bunk75,
          neededForNext: neededFor90,
          message: `4 Mark: You can bunk ${bunk85} ${bunk85 === 1 ? 'class' : 'classes'} till you drop to 3 Mark (<85%)`
        };
      }

      // Tier 3: 80% <= Attendance < 85% (3 Mark)
      if (pct >= 80) {
        const bunk80 = Math.floor((5 * attended - 4 * held) / 4);
        const neededFor85 = Math.max(1, Math.ceil((17 * held - 20 * attended) / 3));

        if (bunk80 === 0) {
          return {
            type: 'edge-80',
            tier: 80,
            marks: 3,
            count: 0,
            bunksTo75: bunk75,
            neededForNext: neededFor85,
            message: '3 Mark: Missing next class drops to 2 Mark (<80%)!'
          };
        }
        return {
          type: 'safe-80',
          tier: 80,
          marks: 3,
          count: bunk80,
          bunksTo75: bunk75,
          neededForNext: neededFor85,
          message: `3 Mark: You can bunk ${bunk80} ${bunk80 === 1 ? 'class' : 'classes'} till you drop to 2 Mark (<80%)`
        };
      }

      // Tier 4: 75% <= Attendance < 80% (2 Mark)
      if (pct >= 75) {
        const neededFor80 = Math.max(1, 4 * held - 5 * attended);

        if (bunk75 === 0) {
          return {
            type: 'edge-75',
            tier: 75,
            marks: 2,
            count: 0,
            neededForNext: neededFor80,
            message: '2 Mark: Missing next class causes exam shortage (<75%)!'
          };
        }
        return {
          type: 'safe-75',
          tier: 75,
          marks: 2,
          count: bunk75,
          neededForNext: neededFor80,
          message: `2 Mark: You can bunk ${bunk75} ${bunk75 === 1 ? 'class' : 'classes'} before exam shortage (<75%)`
        };
      }

      // Tier 5: Attendance < 75% (Shortage / 0 Mark)
      const needed75 = Math.max(1, (3 * held) - (4 * attended));
      return {
        type: 'recovery-75',
        tier: 0,
        marks: 0,
        count: needed75,
        message: `🚨 Shortage (0 Mark): Must attend next ${needed75} consecutive ${needed75 === 1 ? 'class' : 'classes'} to reach 75%`
      };
    }

      percentage, 
      size = 68, 
      strokeWidth = 6, 
      color,
      textColor = 'text-slate-900 dark:text-white',
      trackColor = 'text-slate-100 dark:text-slate-800'
    }) {
      const radius = (size - strokeWidth) / 2;
      const circumference = 2 * Math.PI * radius;
      const validPct = Math.min(100, Math.max(0, percentage));
      const strokeDashoffset = circumference - (validPct / 100) * circumference;

      return (
        <div className="relative flex items-center justify-center flex-shrink-0" style={{ width: size, height: size }}>
          <svg className="w-full h-full transform -rotate-90">
            <circle
              cx={size / 2}

              stroke="currentColor"

    // ==========================================
    // TIMETABLE TAB
    // ==========================================
    function TimetableTab({ timetable, subjects, timeSlots, daysOfWeek, todayDayId, onSaveSlot, onDeleteSlot, onSwitchTab }) {
      const [viewMode, setViewMode] = useState('today');
      const [selectedDay, setSelectedDay] = useState(
        daysOfWeek.some(d => d.id === todayDayId) ? todayDayId : 'mon'
      );
      const [editingSlot, setEditingSlot] = useState(null);
      const [isModalOpen, setIsModalOpen] = useState(false);

      const subjectsMap = useMemo(() => {
        const map = {};
        subjects.forEach(s => { map[s.id] = s; });
        return map;
      }, [subjects]);

      // Active slots for selected day (Friday has custom schedule)
      const activeTimeSlots = useMemo(() => {
        return selectedDay === 'fri' ? FRIDAY_TIME_SLOTS : timeSlots;
      }, [selectedDay, timeSlots]);

      const currentSlotStatus = useMemo(() => {
        const now = new Date();
        const currentMinutes = now.getHours() * 60 + now.getMinutes();
        const activeSlots = todayDayId === 'fri' ? FRIDAY_TIME_SLOTS : timeSlots;

        const parseTime = (tStr) => {
          if (!tStr) return 0;
          const [h, m] = tStr.split(':').map(Number);
          return h * 60 + m;
        };

        let activeId = null;
        let nextId = null;

        for (const slot of activeSlots) {
          if (slot.start && slot.end) {
            const startMin = parseTime(slot.start);
            const endMin = parseTime(slot.end);

            if (currentMinutes >= startMin && currentMinutes <= endMin) {
              activeId = slot.id;
              break;
            } else if (currentMinutes < startMin && !nextId) {
              nextId = slot.id;
            }
          }
        }
        return { activeId, nextId };
      }, [timeSlots, todayDayId]);

      const handleSlotClick = (day, slotId, currentEntry) => {
        setEditingSlot({
          day,
          slotId,
          subjectId: currentEntry?.subjectId || subjects[0]?.id,
          room: currentEntry?.room || 'Room 512',
          isEditing: Boolean(currentEntry)
        });
        setIsModalOpen(true);
      };

      const handleAddNewClass = () => {
        setEditingSlot({
          day: selectedDay,
          slotId: 'p1',
          subjectId: subjects[0]?.id,
          room: 'Room 512',
          isEditing: false
        });
        setIsModalOpen(true);
      };

      const daySchedule = timetable[selectedDay] || [];

      return (
        <div className="space-y-4 pb-20 animate-fade-in">
          
          <div className="flex items-center justify-between gap-2">
            <div className="flex bg-slate-200/80 dark:bg-slate-800 p-1 rounded-xl text-xs font-semibold">
              <button
                id="btn-timetable-today"
                onClick={() => setViewMode('today')}
                className={`px-3 py-1.5 rounded-lg transition-all ${
                  viewMode === 'today'
                    ? 'bg-white dark:bg-blue-600 text-blue-900 dark:text-white shadow-sm'
                    : 'text-slate-600 dark:text-slate-400 hover:text-slate-900'
                }`}
              >
                Today's Schedule
              </button>
              <button
                id="btn-timetable-weekly"
                onClick={() => setViewMode('weekly')}
                className={`px-3 py-1.5 rounded-lg transition-all ${
                  viewMode === 'weekly'
                    ? 'bg-white dark:bg-blue-600 text-blue-900 dark:text-white shadow-sm'
                    : 'text-slate-600 dark:text-slate-400 hover:text-slate-900'
                }`}
              >
                Weekly Grid
              </button>
            </div>

            <button
              id="btn-add-class"
              onClick={handleAddNewClass}
              className="flex items-center gap-1 px-3 py-1.5 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 active:scale-95 rounded-xl transition shadow-sm shadow-blue-500/30"
            >
              <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 4v16m8-8H4" />
              </svg>
              <span>Add Class</span>
            </button>
          </div>

          {viewMode === 'today' && (
            <div className="flex items-center gap-1.5 overflow-x-auto pb-1 no-scrollbar">
              {daysOfWeek.map((d) => {
                const isToday = d.id === todayDayId;
                const isSelected = d.id === selectedDay;
                return (
                  <button
                    key={d.id}
                    id={`day-pill-${d.id}`}
                    onClick={() => setSelectedDay(d.id)}
                    className={`flex-1 min-w-[56px] py-2 px-1 rounded-xl text-center transition-all ${
                      isSelected
                        ? 'bg-slate-900 text-white dark:bg-amber-500 dark:text-slate-950 font-bold shadow-md'
                        : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-50'
                    }`}
                  >
                    <div className="text-[10px] uppercase tracking-wider opacity-80">{d.short}</div>
                    <div className="text-xs font-extrabold flex items-center justify-center gap-0.5 mt-0.5">
                      {d.short}
                      {isToday && (
                        <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                      )}
                    </div>
                  </button>
                );
              })}
            </div>
          )}


          {/* VERTICAL TIMELINE LIST */}
          {viewMode === 'today' && (
            <div className="space-y-2.5">
              <div className="flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 px-1">
                <span className="font-semibold text-slate-700 dark:text-slate-200">
                  {daysOfWeek.find(d => d.id === selectedDay)?.full} Schedule • Room 512
                </span>
                <span className="font-mono">{daySchedule.length} classes</span>
              </div>

              <div className="space-y-2">
                {activeTimeSlots.map((slot) => {
                  if (slot.isBreak) {
                    return (
                      <div 
                        key={slot.id} 
                        className="flex items-center gap-3 py-1.5 px-3 bg-amber-50/70 dark:bg-amber-950/20 border border-amber-200/50 dark:border-amber-800/30 rounded-xl text-amber-800 dark:text-amber-300 text-xs"
                      >
                        <span className="text-base">☕</span>
                        <span className="font-semibold">{slot.label}</span>
                        <span className="text-[11px] text-amber-600/80 dark:text-amber-400/80 ml-auto font-mono">
                          {slot.time}
                        </span>
                      </div>
                    );
                  }

                  const entry = daySchedule.find(e => e.slotId === slot.id);
                  const subject = entry ? subjectsMap[entry.subjectId] : null;

                  const isCurrent = selectedDay === todayDayId && currentSlotStatus.activeId === slot.id;
                  const isNext = selectedDay === todayDayId && !currentSlotStatus.activeId && currentSlotStatus.nextId === slot.id;

                  return (
                    <div
                      key={slot.id}
                      onClick={() => handleSlotClick(selectedDay, slot.id, entry)}
                      className={`group relative flex items-start gap-3 p-3.5 rounded-2xl border transition-all cursor-pointer select-none ${
                        isCurrent
                          ? 'bg-blue-50/90 dark:bg-blue-950/40 border-blue-500 shadow-md ring-2 ring-blue-500/30'
                          : isNext
                          ? 'bg-amber-50/80 dark:bg-amber-950/30 border-amber-400 shadow-sm'

    // ==========================================
    // BUNK SCENARIO SIMULATOR COMPONENT
    // Overview of attendance impact if taking:
    // 1) 1st hour off (Period 1)
    // 2) First 4 hours off (Periods 1 to 4)
    // 3) Entire day off (All periods for the day)
    // ==========================================
    function BunkSimulatorCard({
      timetable,
      subjects,
      timeSlots,
      daysOfWeek,
      todayDayId,
      onApplyBatchAbsences,
      onResetToOfficial,
      isSimulated
    }) {
      const [isExpanded, setIsExpanded] = useState(true);
      const [selectedDay, setSelectedDay] = useState(() => {
        return daysOfWeek && daysOfWeek.some(d => d.id === todayDayId) ? todayDayId : 'tue';
      });
      const [selectedScenario, setSelectedScenario] = useState('1st-hour'); // '1st-hour' | 'first-4-hours' | 'full-day'

      const subjectsMap = useMemo(() => {
        const map = {};
        (subjects || []).forEach(s => { map[s.id] = s; });
        return map;
      }, [subjects]);

      const timeSlotsMap = useMemo(() => {
        const map = {};
        (timeSlots || []).forEach(t => { map[t.id] = t; });
        return map;
      }, [timeSlots]);

      const fridayTimeSlotsMap = useMemo(() => {
        const map = {};
        (FRIDAY_TIME_SLOTS || []).forEach(t => { map[t.id] = t; });
        return map;
      }, []);

      // Scheduled periods for selected day
      const daySchedule = useMemo(() => {
        const rawSlots = (timetable && timetable[selectedDay]) || [];
        return rawSlots.filter(slot => slot.subjectId && slot.subjectId !== 'free' && subjectsMap[slot.subjectId]);
      }, [timetable, selectedDay, subjectsMap]);

      // Base overall attendance
      const currentOverall = useMemo(() => {
        const attended = (subjects || []).reduce((sum, s) => sum + s.attended, 0);
        const held = (subjects || []).reduce((sum, s) => sum + s.held, 0);
        const pct = calculatePercentage(attended, held);
        const bunk90 = Math.floor((10 * attended - 9 * held) / 9);
        const bunk75 = Math.floor((4 * attended - 3 * held) / 3);
        const needed90 = getClassesToReachTarget(attended, held, 90);
        const needed75 = getClassesToReachTarget(attended, held, 75);
        return { 
          attended, 
          held, 
          pct, 
          bunk90: Math.max(0, bunk90), 
          bunk75: Math.max(0, bunk75),
          needed90,
          needed75
        };
      }, [subjects]);

      // Calculate outcome for any scenario
      const getScenarioOutcome = (scenarioKey) => {
        let missedSlots = [];
        if (scenarioKey === '1st-hour') {
          missedSlots = daySchedule.slice(0, 1);
        } else if (scenarioKey === 'first-4-hours') {
          missedSlots = daySchedule.slice(0, 4);
        } else {
          missedSlots = daySchedule.slice(0);
        }

        const missedCounts = {};
        missedSlots.forEach(s => {
          missedCounts[s.subjectId] = (missedCounts[s.subjectId] || 0) + 1;
        });

        const newHeld = currentOverall.held + missedSlots.length;
        const newAttended = currentOverall.attended; // all missed = 0 attended
        const newPct = calculatePercentage(newAttended, newHeld);
        const delta = Math.round((newPct - currentOverall.pct) * 10) / 10;
        const deltaFormatted = delta > 0 ? `+${delta}%` : `${delta}%`;

        const bunk90 = Math.floor((10 * newAttended - 9 * newHeld) / 9);
        const bunk75 = Math.floor((4 * newAttended - 3 * newHeld) / 3);
        const neededOverall90 = getClassesToReachTarget(newAttended, newHeld, 90, false);
        const neededOverallOver90 = getClassesToReachTarget(newAttended, newHeld, 90, true);
        const neededOverall75 = getClassesToReachTarget(newAttended, newHeld, 75, false);

        // Subject breakdown
        const subjectBreakdown = missedSlots.map(slot => {
          const sub = subjectsMap[slot.subjectId] || { name: 'Unknown', code: 'N/A', shortName: 'N/A', attended: 0, held: 0, faculty: '', color: '#3b82f6' };
          const slotInfo = (selectedDay === 'fri' ? fridayTimeSlotsMap : timeSlotsMap)[slot.slotId];
          const addHeld = missedCounts[slot.subjectId] || 1;
          const curSubPct = calculatePercentage(sub.attended, sub.held);
          const newSubHeld = sub.held + addHeld;
          const newSubPct = calculatePercentage(sub.attended, newSubHeld);
          const dropsBelow90 = curSubPct >= 90 && newSubPct < 90;
          const dropsBelow75 = curSubPct >= 75 && newSubPct < 75;
          const isBelow90 = newSubPct < 90;
          const subClassesTo90 = isBelow90 ? getClassesToReachTarget(sub.attended, newSubHeld, 90, false) : 0;
          const subClassesToOver90 = isBelow90 ? getClassesToReachTarget(sub.attended, newSubHeld, 90, true) : 0;
          const subAttendedAfterOver90 = sub.attended + subClassesToOver90;
          const subHeldAfterOver90 = newSubHeld + subClassesToOver90;
          const subPctAfterOver90 = calculatePercentage(subAttendedAfterOver90, subHeldAfterOver90);
          const subAttendedAfter90 = sub.attended + subClassesTo90;
          const subHeldAfter90 = newSubHeld + subClassesTo90;
          const subPctAfter90 = calculatePercentage(subAttendedAfter90, subHeldAfter90);
          const subBunk90 = !isBelow90 ? Math.max(0, Math.floor((10 * sub.attended - 9 * newSubHeld) / 9)) : 0;

          return {
            slot,
            slotInfo,
            sub,
            curSubPct,
            newSubHeld,
            newSubPct,
            dropsBelow90,
            dropsBelow75,
            isBelow90,
            subClassesTo90,
            subClassesToOver90,
            subAttendedAfterOver90,
            subHeldAfterOver90,
            subPctAfterOver90,
            subAttendedAfter90,
            subHeldAfter90,
            subPctAfter90,
            subBunk90
          };
        });

        // Unique subjects impacted
        const uniqueSubjectImpact = [];
        const seenSubs = new Set();
        subjectBreakdown.forEach(item => {
          if (!seenSubs.has(item.sub.id)) {
            seenSubs.add(item.sub.id);
            uniqueSubjectImpact.push(item);
          }
        });

        const anyDropBelow90 = uniqueSubjectImpact.some(s => s.dropsBelow90 || s.isBelow90);
        const anyDropBelow75 = uniqueSubjectImpact.some(s => s.dropsBelow75);

        return {
          scenarioKey,
          missedSlots,
          missedCount: missedSlots.length,
          missedSubjectIds: missedSlots.map(s => s.subjectId),
          newAttended,
          newHeld,

      const scenarios = useMemo(() => {

    // ==========================================
    // ATTENDANCE TAB
    // ==========================================
    function AttendanceTab({
      subjects,
      onMarkAttendance,
      onUndoLastAction,
      canUndo,
      onAddSubject,
      onUpdateSubject,
      onDeleteSubject,
      onResetToOfficial,
      timetable,
      timeSlots,
      daysOfWeek,
      todayDayId,
      onApplyBatchAbsences,
      syncInfo
    }) {
      const [isManageModalOpen, setIsManageModalOpen] = useState(false);
      const [filter, setFilter] = useState('all');

      const isSimulated = useMemo(() => {
        if (subjects.length !== DEFAULT_SUBJECTS.length) return true;
        return subjects.some(s => {
          const orig = DEFAULT_SUBJECTS.find(d => d.id === s.id);
          return !orig || orig.attended !== s.attended || orig.held !== s.held;
        });
      }, [subjects]);

      const overallStats = useMemo(() => {
        let totalAttended = 0;
        let totalHeld = 0;
        let fullMarksCount = 0; // >= 90%
        let eligibleCount = 0;  // 75% - 89.9%
        let shortageCount = 0;  // < 75%

        subjects.forEach((s) => {
          totalAttended += s.attended;
          totalHeld += s.held;
          const pct = calculatePercentage(s.attended, s.held);
          if (pct >= 90) fullMarksCount++;
          else if (pct >= 75) eligibleCount++;
          else shortageCount++;
        });

        const overallPct = calculatePercentage(totalAttended, totalHeld);
        const overallStatus = getAttendanceStatus(overallPct);
        const overallBunk = calculateBunkInfo(totalAttended, totalHeld);

        return {
          totalAttended,
          totalHeld,
          overallPct,
          overallStatus,
          overallBunk,
          fullMarksCount,
          eligibleCount,
          shortageCount,
          totalSubjects: subjects.length
        };
      }, [subjects]);

      const filteredSubjects = useMemo(() => {
        if (filter === 'full-marks') {
          return subjects.filter(s => calculatePercentage(s.attended, s.held) >= 90);
        }
        if (filter === 'below-90') {
          return subjects.filter(s => calculatePercentage(s.attended, s.held) < 90);
        }
        return subjects;
      }, [subjects, filter]);

      return (
        <div className="space-y-4 pb-20 animate-fade-in">

          {/* LIVE CLOUD SYNC BANNER */}
          {syncInfo && syncInfo.timestamp && (
            <div className="bg-white dark:bg-[#1a1921] border border-slate-200/80 dark:border-white/[0.08] rounded-2xl px-3.5 py-2.5 flex items-center justify-between gap-3 text-xs shadow-xs transition-colors">
              <div className="flex items-center gap-2 min-w-0">
                <span className="w-2 h-2 rounded-full bg-blue-600 dark:bg-emerald-400 animate-pulse flex-shrink-0"></span>
                <div className="min-w-0">
                  <p className="font-extrabold text-slate-900 dark:text-white text-[11px] truncate">
                    ETLAB Attendance Synced
                  </p>
                  <p className="text-slate-500 dark:text-slate-400 text-[10px] truncate">
                    Last refreshed: <b className="text-slate-700 dark:text-slate-200">{syncInfo.timestamp}</b>
                  </p>
                </div>
              </div>
              <span className="px-2 py-0.5 rounded-full text-[9px] font-extrabold bg-blue-50 text-blue-700 border border-blue-200/60 dark:bg-pink-500/15 dark:text-pink-300 dark:border-pink-500/30 flex-shrink-0">
                Auto 7am • 3pm • 9pm
              </span>
            </div>
          )}
          
          {/* SIMULATION ACTIVE NOTICE */}
          {isSimulated && (
            <div className="bg-amber-500/10 border border-amber-500/40 rounded-2xl p-3.5 flex items-center justify-between gap-3 text-xs shadow-sm">
              <div className="flex items-center gap-2.5 min-w-0">
                <span className="text-xl flex-shrink-0">⚠️</span>
                <div className="min-w-0">
                  <p className="font-bold text-amber-600 dark:text-amber-400">Attendance Modified (Simulation Active)</p>
                  <p className="text-slate-500 dark:text-slate-400 text-[11px] truncate">
                    Manual/simulated absent or present marks applied. Official ETLAB: {DEFAULT_SUBJECTS.reduce((a,b)=>a+b.attended,0)}/{DEFAULT_SUBJECTS.reduce((a,b)=>a+b.held,0)} ({calculatePercentage(DEFAULT_SUBJECTS.reduce((a,b)=>a+b.attended,0), DEFAULT_SUBJECTS.reduce((a,b)=>a+b.held,0))}%)
                  </p>
                </div>
              </div>
              <button
                onClick={onResetToOfficial}
                className="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 active:scale-95 text-slate-950 font-bold text-xs rounded-xl shadow transition flex-shrink-0 flex items-center gap-1.5"
              >
                <span>🔄</span>
                <span>Restore Official</span>
              </button>
            </div>

    // ==========================================
    // MAIN APP COMPONENT
    // ==========================================
    const STORAGE_KEYS = {
      SUBJECTS: 'mits_s3_cs_ai_shawn_v1789911516',
      TIMETABLE: 'mits_s3_cs_ai_timetable_v8',
      ACTIVE_TAB: 'mits_s3_cs_ai_active_tab_v8',
      PHONE_FRAME: 'mits_s3_cs_ai_phone_frame_v8'
    };

    function App() {
      const [activeTab, setActiveTab] = useState(() => {
        return localStorage.getItem(STORAGE_KEYS.ACTIVE_TAB) || 'attendance';
      });

      const [isPhoneFrame, setIsPhoneFrame] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEYS.PHONE_FRAME);
        return saved !== null ? JSON.parse(saved) : true;
      });

      const [subjects, setSubjects] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEYS.SUBJECTS);
        if (saved) {
          try { return JSON.parse(saved); } catch (e) { console.error(e); }
        }
        return DEFAULT_SUBJECTS;
      });

      const [historyStack, setHistoryStack] = useState([]);

      const [timetable, setTimetable] = useState(() => {
        const saved = localStorage.getItem(STORAGE_KEYS.TIMETABLE);
        if (saved) {
          try { return JSON.parse(saved); } catch (e) { console.error(e); }
        }
        return DEFAULT_TIMETABLE;
      });

      const [toast, setToast] = useState(null);

      // Theme State: Dark Mode (Image 4 Helios) or Light Mode (Image 3 Dashboard)
      const [isDarkMode, setIsDarkMode] = useState(() => {
        const saved = localStorage.getItem('mits_theme');
        if (saved !== null) {
          return saved === 'dark';
        }
        return true; // Default to dark mode (matches existing look or Helios)
      });

      useEffect(() => {
        if (isDarkMode) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('mits_theme', 'dark');
          const metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) metaTheme.setAttribute('content', '#121114');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('mits_theme', 'light');
          const metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) metaTheme.setAttribute('content', '#dbe4f3');
        }
      }, [isDarkMode]);

      const toggleTheme = () => {
        setIsDarkMode(prev => !prev);
      };

      const [syncInfo, setSyncInfo] = useState(() => {
        const saved = localStorage.getItem('mits_last_synced_info');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return null;
      });

      const showToast = (message, type = 'info', icon = '✨') => {
        setToast({ message, type, icon });
        setTimeout(() => setToast(null), 3200);
      };

      // Automatically fetch updated attendance on app load
      useEffect(() => {
        fetch('./attendance_scraped.json?t=' + Date.now())
          .then(res => {
            if (!res.ok) throw new Error('No scraped file');
            return res.json();
          })
          .then(data => {
            if (data && data.Subjects && data.Subjects.length > 0) {
              const info = {
                timestamp: data.Timestamp,
                student: data.Student,
                overall: data.Overall
              };
              setSyncInfo(info);
              localStorage.setItem('mits_last_synced_info', JSON.stringify(info));

              // If new sync timestamp arrived, update subjects
              const lastApplied = localStorage.getItem('mits_applied_sync_timestamp');
              if (lastApplied !== data.Timestamp) {
                setSubjects(prevSubjects => {
                  return prevSubjects.map(sub => {
                    const match = data.Subjects.find(s => s.Code && s.Code.toUpperCase() === sub.code.toUpperCase());
                    if (match) {
                      return {
                        ...sub,
                        attended: match.Attended,
                        held: match.Held
                      };
                    }
                    return sub;
                  });
                });
                localStorage.setItem('mits_applied_sync_timestamp', data.Timestamp);
                showToast(`ETLAB Synced: ${data.Timestamp}`, 'success', '⚡');
              }
            }
          })
          .catch(err => {
            // Local standalone mode fallback
          });
      }, []);

      useEffect(() => {
        localStorage.setItem(STORAGE_KEYS.ACTIVE_TAB, activeTab);
      }, [activeTab]);

      useEffect(() => {
        localStorage.setItem(STORAGE_KEYS.PHONE_FRAME, JSON.stringify(isPhoneFrame));
      }, [isPhoneFrame]);

      useEffect(() => {
        localStorage.setItem(STORAGE_KEYS.SUBJECTS, JSON.stringify(subjects));
      }, [subjects]);

      useEffect(() => {
        localStorage.setItem(STORAGE_KEYS.TIMETABLE, JSON.stringify(timetable));
      }, [timetable]);

      const { todayDayId, todayDayName, currentDateFormatted } = useMemo(() => {
        const now = new Date();
        const dayIndex = now.getDay();
        const map = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
        const names = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const options = { month: 'short', day: 'numeric', year: 'numeric' };
        return {
          todayDayId: map[dayIndex],
          todayDayName: names[dayIndex],
          currentDateFormatted: now.toLocaleDateString('en-US', options)
        };
      }, []);

      const attendanceWarningCount = useMemo(() => {
        return subjects.filter(s => calculatePercentage(s.attended, s.held) < 75).length;
      }, [subjects]);

      const handleMarkAttendance = (subjectId, action) => {
        const targetSub = subjects.find(s => s.id === subjectId);
        if (!targetSub) return;

        setHistoryStack(prev => [...prev, {
          subjects: JSON.parse(JSON.stringify(subjects)),
          actionDescription: `${action.toUpperCase()} for ${targetSub.code}`
        }]);

        setSubjects(prev => prev.map(s => {
          if (s.id !== subjectId) return s;
          if (action === 'present') {
            return { ...s, attended: s.attended + 1, held: s.held + 1 };
          } else if (action === 'absent') {
            return { ...s, held: s.held + 1 };
          }
          return s;
        }));

        if (action === 'present') {
          showToast(`Marked Present for ${targetSub.code}`, 'success', '✓');
        } else if (action === 'absent') {
          showToast(`Marked Absent for ${targetSub.code}`, 'warning', '⚠️');
        } else {
          showToast(`Class marked Cancelled for ${targetSub.code}`, 'info', 'ℹ️');
        }
      };

      const handleUndoLastAction = () => {
        if (historyStack.length === 0) return;
        const lastItem = historyStack[historyStack.length - 1];
        setSubjects(lastItem.subjects);
        setHistoryStack(prev => prev.slice(0, prev.length - 1));
        showToast(`Undone: ${lastItem.actionDescription}`, 'info', '↩');
      };

      const handleAddSubject = (newSubject) => {
        setSubjects(prev => [...prev, newSubject]);
        showToast(`Added ${newSubject.code}`, 'success', '📚');
      };

      const handleUpdateSubject = (updated) => {
        setSubjects(prev => prev.map(s => s.id === updated.id ? updated : s));
        showToast(`Updated ${updated.code}`, 'success', '✏️');
      };

      const handleDeleteSubject = (id) => {
        setSubjects(prev => prev.filter(s => s.id !== id));
        showToast('Subject removed', 'info', '🗑️');
      };

      const handleSaveSlot = ({ day, slotId, subjectId, room }) => {
        setTimetable(prev => {
          const daySlots = prev[day] || [];
          const filtered = daySlots.filter(s => s.slotId !== slotId);
          return {
            ...prev,
            [day]: [...filtered, { slotId, subjectId, room: room || 'Room 512' }]
          };
        });
        showToast('Timetable schedule updated', 'success', '📅');
      };

      const handleDeleteSlot = (day, slotId) => {
        setTimetable(prev => {
          const daySlots = prev[day] || [];
          return {
            ...prev,
            [day]: daySlots.filter(s => s.slotId !== slotId)
          };
        });
        showToast('Class removed', 'info', '🗑️');
      };

      const handleResetData = () => {
        const defAttended = DEFAULT_SUBJECTS.reduce((sum, s) => sum + s.attended, 0);
        const defHeld = DEFAULT_SUBJECTS.reduce((sum, s) => sum + s.held, 0);
        const defPct = calculatePercentage(defAttended, defHeld);
        if (confirm(`Reset attendance & timetable to official student record for Shawn Subin Philip (${defAttended}/${defHeld}, ${defPct}%)?`)) {
          localStorage.removeItem(STORAGE_KEYS.SUBJECTS);
          localStorage.removeItem(STORAGE_KEYS.TIMETABLE);
          setSubjects(DEFAULT_SUBJECTS);
          setTimetable(DEFAULT_TIMETABLE);
          setHistoryStack([]);
          showToast(`Reset to Shawn Subin Philip official attendance (${defAttended}/${defHeld}, ${defPct}%)`, 'info', '🔄');
        }
      };

      const handleResetToOfficialAttendance = () => {
        const defAttended = DEFAULT_SUBJECTS.reduce((sum, s) => sum + s.attended, 0);
        const defHeld = DEFAULT_SUBJECTS.reduce((sum, s) => sum + s.held, 0);
        const defPct = calculatePercentage(defAttended, defHeld);
        localStorage.removeItem(STORAGE_KEYS.SUBJECTS);
        setSubjects(DEFAULT_SUBJECTS);
        setHistoryStack([]);
        showToast(`Restored official ETLAB attendance (${defAttended}/${defHeld}, ${defPct}%)`, 'success', '🔄');
      };

      const handleApplyBatchAbsences = (subjectIds) => {
        if (!subjectIds || subjectIds.length === 0) return;

        setHistoryStack(prev => [...prev, {
          subjects: JSON.parse(JSON.stringify(subjects)),
          actionDescription: `Simulated bunk: ${subjectIds.length} classes`
        }]);

        const counts = {};
        subjectIds.forEach(id => { counts[id] = (counts[id] || 0) + 1; });

        setSubjects(prev => prev.map(s => {
          if (counts[s.id]) {
            return { ...s, held: s.held + counts[s.id] };
          }
          return s;
        }));

        showToast(`Simulating ${subjectIds.length} missed classes in tracker`, 'warning', '⚠️');
      };

      return (
        <div className="min-h-screen bg-[#dbe4f3] dark:bg-[#121114] font-sans text-slate-900 dark:text-slate-100 flex flex-col items-center justify-start antialiased selection:bg-blue-600 dark:selection:bg-pink-500 selection:text-white transition-colors duration-300">
          
          <Toast toast={toast} onClose={() => setToast(null)} />

          <div className={`w-full transition-all duration-300 ${
            isPhoneFrame 
              ? 'max-w-md my-0 sm:my-5 sm:rounded-[42px] sm:shadow-[0_25px_65px_-15px_rgba(71,85,105,0.25)] dark:sm:shadow-[0_25px_70px_-15px_rgba(0,0,0,0.85)] sm:border-[8px] sm:border-white/90 dark:sm:border-[#221f29] overflow-hidden bg-[#edf3fc] dark:bg-[#16141c] min-h-screen sm:min-h-[860px] relative'
              : 'max-w-xl md:max-w-3xl bg-[#edf3fc] dark:bg-[#16141c] min-h-screen relative shadow-2xl'
          }`}>
            
            {isPhoneFrame && (
              <div className="hidden sm:flex justify-center pt-2.5 pb-1 bg-[#dbe4f3] dark:bg-[#121114] transition-colors">
                <div className="w-24 h-4 bg-[#cbd5e1] dark:bg-[#221f29] rounded-full flex items-center justify-center gap-2">
                  <span className="w-2 h-2 rounded-full bg-[#94a3b8] dark:bg-[#121114]"></span>
                  <span className="w-10 h-1 bg-[#94a3b8] dark:bg-[#121114] rounded-full"></span>
                </div>
              </div>
            )}

            <Header
              currentTab={activeTab}
              onResetData={handleResetData}
              isPhoneFrame={isPhoneFrame}
              setIsPhoneFrame={setIsPhoneFrame}
              todayDayName={todayDayName}
              currentDateFormatted={currentDateFormatted}
              syncInfo={syncInfo}
              isDarkMode={isDarkMode}
              onToggleTheme={toggleTheme}
            />

            <main className="p-4 overflow-y-auto">
              {activeTab === 'timetable' && (
                <TimetableTab
                  timetable={timetable}
                  subjects={subjects}
                  timeSlots={TIME_SLOTS}
                  daysOfWeek={DAYS_OF_WEEK}
                  todayDayId={todayDayId}
                  onSaveSlot={handleSaveSlot}
                  onDeleteSlot={handleDeleteSlot}
                  onSwitchTab={setActiveTab}
                />
              )}

              {activeTab === 'attendance' && (
                <AttendanceTab
                  subjects={subjects}
                  onMarkAttendance={handleMarkAttendance}
                  onUndoLastAction={handleUndoLastAction}
                  canUndo={historyStack.length > 0}
                  onAddSubject={handleAddSubject}
                  onUpdateSubject={handleUpdateSubject}
                  onDeleteSubject={handleDeleteSubject}
                  onResetToOfficial={handleResetToOfficialAttendance}
                  timetable={timetable}
                  timeSlots={TIME_SLOTS}
                  daysOfWeek={DAYS_OF_WEEK}
                  todayDayId={todayDayId}
                  onApplyBatchAbsences={handleApplyBatchAbsences}
                  syncInfo={syncInfo}
                />
              )}
            </main>

            <BottomNav
              activeTab={activeTab}
              setActiveTab={setActiveTab}
              attendanceWarningCount={attendanceWarningCount}
            />

          </div>

        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);

    // Register Service Worker for PWA (Add to Home Screen)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.log('Service worker not registered in this environment:', err);
        });
      });
    }
  </script>
</body>
</html>
